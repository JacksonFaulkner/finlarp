[project]
name = "security-spread"
version = "0.1.0"
description = "SEC/market data pipeline behind the security_spread nvim plugin"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "mcp>=1.2",
    "pydantic>=2.9.0",
    "rauth>=0.7.3",
    "requests>=2.34.2",
]

# Editable install puts the plugin root on sys.path (hatch dev-mode-dirs
# default), so any script can `import db` / `from sources import ...`
# without a sys.path hack, whatever its own directory or cwd.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources", "views", "jobs", "models"]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
# pyflakes + syntax errors + bugbear; zip(strict=) not enforced (B905)
select = ["E9", "F", "B"]
ignore = ["B905"]
