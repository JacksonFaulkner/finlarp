[project]
name = "finlarp"
version = "0.1.0"
description = "finlarp: Financial Learning & Research Platform. SEC data pipeline, terminal UI and Neovim plugin."
requires-python = ">=3.12"
dependencies = [
    "databento>=0.87.0",
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "mcp>=1.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.9.0",
    "pytz>=2026.5",
    "rauth>=0.7.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "websocket-client>=1.9.2",
]

# Editable install puts py/ on sys.path (dev-mode-dirs), so any script can
# `from core import db` / `from sources import ...` without a sys.path hack,
# whatever its own directory or cwd.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/core", "py/sources", "py/derive", "py/jobs", "py/agent"]
dev-mode-dirs = ["py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
# pyflakes + syntax errors + bugbear; zip(strict=) not enforced (B905)
select = ["E9", "F", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
pythonpath = ["py"]
testpaths = ["tests"]
markers = [
    "integration: needs the local market data (and possibly sandbox-exec)",
    "slow: takes more than a few seconds",
]
