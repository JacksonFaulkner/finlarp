# Run by prek (`just hooks` installs it) or pre-commit; same format.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github
  - repo: local
    hooks:
      - id: selene
        name: selene
        entry: selene
        language: system
        types: [lua]
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path tui/Cargo.toml --check
        language: system
        types: [rust]
        pass_filenames: false
