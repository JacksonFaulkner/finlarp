[package]
name = "finlarp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fl"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
duckdb = { version = "1.1", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
open = "5.4.4"
arboard = "3.6.1"
textwrap = "0.16.4"
unicode-width = "0.2"
tui-input = "0.15"
throbber-widgets-tui = "0.11"
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
# The bell-jar rasterizer: shared with the offline GIF tool (tools/poly3d).
poly3d = { path = "../tools/poly3d" }

# The 3D renderer is per-pixel hot loops: optimise it even in debug builds, so `cargo run`
# and `cargo test` orbit smoothly and the frame-budget test runs in seconds.
[profile.dev.package.poly3d]
opt-level = 3
