[package]
name = "finlarp"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
duckdb = { version = "1.1", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
open = "5.4.4"
arboard = "3.6.1"
textwrap = "0.16.4"
unicode-width = "0.2"
tui-input = "0.15"
